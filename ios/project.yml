name: GleanIOS
options:
  bundleIdPrefix: com.jiaming
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
  MdxKit:
    path: MdxKit

targets:
  GleanIOS:
    type: application
    platform: iOS
    sources:
      - GleanIOS
    settings:
      base:
        SWIFT_VERSION: 6.0
        PRODUCT_BUNDLE_IDENTIFIER: com.jiaming.glean.ios
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 拾词
    dependencies:
      - package: GRDB
        product: GRDB
      - package: MdxKit
        product: MdxKit
