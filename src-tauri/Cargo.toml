[package]
name = "glean"
version = "0.3.8"
description = "拾词 / Glean - A beautiful MDict dictionary app"
authors = ["Glean"]
edition = "2021"

[lib]
name = "glean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "glean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
flate2 = "1"
nom = "7"
log = "0.4"
pretty_env_logger = "0.5"
dirs = "5"
bincode = "1"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
